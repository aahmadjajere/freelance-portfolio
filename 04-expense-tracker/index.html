<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <header><div><p class="eyebrow">JavaScript portfolio project</p><h1>Expense Tracker</h1><p>Track simple personal expenses directly in the browser.</p></div><button id="clearAll" class="ghost">Clear all</button></header>
  <section class="summary"><div><span>Total</span><strong id="total">$0.00</strong></div><div><span>Items</span><strong id="count">0</strong></div></section>
  <form id="expenseForm" class="form">
    <label>Description<input id="description" required maxlength="60" placeholder="e.g. Lunch"></label>
    <label>Category<select id="category"><option>Food</option><option>Transport</option><option>Study</option><option>Shopping</option><option>Other</option></select></label>
    <label>Amount<input id="amount" required type="number" min="0" step="0.01" placeholder="0.00"></label>
    <button class="primary" type="submit">Add expense</button>
  </form>
  <section><div class="list-head"><h2>Expenses</h2><select id="filter"><option>All</option><option>Food</option><option>Transport</option><option>Study</option><option>Shopping</option><option>Other</option></select></div><div id="empty" class="empty">No expenses yet.</div><div id="list" class="list"></div></section>
</div>
<script src="app.js"></script>
</body></html>
